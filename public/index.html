<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Topupku API Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0f172a;
padding:20px;
color:white;
}

.container{
max-width:1000px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:32px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

input,select{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:10px;
background:#334155;
color:white;
margin-top:8px;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#3b82f6;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#2563eb;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

pre{
background:black;
padding:15px;
border-radius:10px;
overflow:auto;
min-height:250px;
color:#00ff66;
}

@media(max-width:700px){
.grid{
grid-template-columns:1fr;
}
}

</style>
</head>
<body>

<div class="container">

<div class="title">
<h1>🚀 Topupku API Panel</h1>
<p>REST API Testing Dashboard</p>
</div>

<div class="card">

<h3>API Credential</h3>

<input id="api_id" placeholder="API ID">

<input id="api_key" placeholder="API KEY">

</div>

<div class="grid">

<div class="card">

<h3>Menu</h3>

<select id="endpoint">
<option value="profile">Profile</option>
<option value="service">Service</option>
<option value="kategori">Kategori</option>
<option value="order">Order</option>
<option value="status">Status Order</option>
<option value="game">Cek Nickname</option>
<option value="payment">Deposit</option>
<option value="status-payment">Status Deposit</option>
</select>

<input id="filter_value" placeholder="Filter Service">

<input id="service_id" placeholder="Service ID">

<input id="target_id" placeholder="Target ID">

<input id="target_server" placeholder="Target Server">

<input id="order_id" placeholder="Order ID">

<input id="user_id" placeholder="User ID">

<input id="zone_id" placeholder="Zone ID">

<input id="code" placeholder="Game Code">

<input id="reff_id" placeholder="Reff ID">

<input id="kode_bank" placeholder="Kode Bank">

<input id="nominal" placeholder="Nominal">

<button onclick="submitAPI()">
Kirim Request
</button>

</div>

<div class="card">

<h3>Response</h3>

<pre id="result">
Menunggu request...
</pre>

</div>

</div>

</div>

<script>

async function submitAPI(){

const endpoint =
document.getElementById("endpoint").value;

const params = new URLSearchParams({

api_id:
document.getElementById("api_id").value,

api_key:
document.getElementById("api_key").value,

filter_value:
document.getElementById("filter_value").value,

service_id:
document.getElementById("service_id").value,

target_id:
document.getElementById("target_id").value,

target_server:
document.getElementById("target_server").value,

order_id:
document.getElementById("order_id").value,

user_id:
document.getElementById("user_id").value,

zone_id:
document.getElementById("zone_id").value,

code:
document.getElementById("code").value,

reff_id:
document.getElementById("reff_id").value,

kode_bank:
document.getElementById("kode_bank").value,

nominal:
document.getElementById("nominal").value

});

document.getElementById("result").innerHTML =
"Loading...";

try{

const res = await fetch(
`/api/${endpoint}?${params}`
);

const json = await res.json();

document.getElementById("result").innerHTML =
JSON.stringify(json,null,2);

}catch(err){

document.getElementById("result").innerHTML =
err.message;

}

}

</script>

</body>
  </html>
